<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gradient Descent · Riemannian S²</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>

<link rel="stylesheet" href="styles/common.css" />
</head>
<body class="descent">

<canvas id="stage"></canvas>
<div id="label-layer"></div>

<header class="top">
  <div class="brand">
    <span class="mark">Riemannian S²</span>
    <span class="sub">gradient descent</span>
  </div>
  <nav class="nav-links">
    <a href="index.html">Index</a>
    <a href="Geometry Primer.html">Geometry</a>
    <a href="Gradient Descent.html" class="active">Gradient descent</a>
  </nav>
</header>

<aside class="tweaks">
  <div class="title"><span>Tweaks</span></div>
  <div class="toggle-row">
    <div class="lbl">Palette</div>
    <div id="palette-grid" class="palette-grid"></div>
  </div>
  <div class="toggle-row">
    <div class="lbl">Sphere</div>
    <div class="seg">
      <button data-tw-style="translucent" class="active">Translucent</button>
      <button data-tw-style="matte">Matte</button>
    </div>
  </div>

  <hr class="rule" />

  <div class="legend">
    <div class="item"><span class="swatch" style="background:var(--accent)"></span> current xₖ</div>
    <div class="item"><span class="swatch" style="background:var(--viz-q)"></span> target(s)</div>
    <div class="item"><span class="swatch line" style="background:var(--viz-euclid)"></span> ∇f (ambient)</div>
    <div class="item"><span class="swatch line" style="background:var(--viz-tangent)"></span> ∇ʀf (tangent)</div>
    <div class="item"><span class="swatch line" style="background:var(--viz-retract)"></span> step −α∇ʀf</div>
    <div class="item"><span class="swatch line" style="background:var(--viz-geodesic)"></span> trajectory</div>
  </div>
</aside>

<!-- Colorbar -->
<aside class="colorbar">
  <div class="bar"><canvas id="cb"></canvas></div>
  <div class="ticks">
    <span class="lbl-axis"><span id="cb-expr">f(x)</span></span>
    <span class="annot top"><span id="cb-min">—</span></span>
    <span class="annot label-top">min · attractor</span>
    <span class="annot bot"><span id="cb-max">—</span></span>
    <span class="annot label-bot">max</span>
  </div>
</aside>

<aside class="descent-rail">

  <div class="iter-block">
    <div class="iter-line">
      <span class="key">iteration</span>
      <span class="nums">
        <span id="iter-num">000</span><span class="slash">/</span><span id="iter-total" class="tot">080</span>
      </span>
    </div>
    <div class="iter-fnow">
      <span class="lhs">f(xₖ) = <span id="f-now">—</span></span>
      <span class="gap" id="f-gap"></span>
    </div>
  </div>

  <div class="plot-wrap">
    <canvas id="plot"></canvas>
  </div>

  <div class="cost-block">
    <div class="cost-name" id="cost-name">Rayleigh quotient</div>
    <div class="cost-expr" id="cost-expr"></div>
    <div class="cost-seg">
      <button data-cost="rayleigh" class="active">Rayleigh</button>
      <button data-cost="distance">Distance²</button>
      <button data-cost="frechet">Fréchet</button>
    </div>
  </div>

  <div class="formulas-block">
    <div class="formula-card">
      <div class="ttl">Riemannian gradient</div>
      <div id="formula-grad"></div>
    </div>
    <div class="formula-card">
      <div class="ttl">Update rule</div>
      <div id="formula-update"></div>
    </div>
  </div>

  <div class="controls-block">
    <div class="controls">
      <div class="row">
        <label>step α</label>
        <input id="alpha" type="range" min="0.02" max="1.0" step="0.01" value="0.18" />
        <span class="value" id="alpha-val">0.18</span>
      </div>
    </div>
    <div class="btn-row">
      <button id="btn-reset" class="nav-btn"><span class="lbl">Reset</span></button>
      <button id="btn-step"  class="nav-btn"><span class="lbl">Step</span></button>
      <button id="btn-play"  class="nav-btn"><span class="lbl">Play</span></button>
    </div>
  </div>

</aside>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="scripts/descent.js"></script>

</body>
</html>
