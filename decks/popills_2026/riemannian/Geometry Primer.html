<body>

<canvas id="stage"></canvas>

<header class="top">
  <div class="brand">
    <span class="mark">Riemannian S²</span>
    <span class="sub">a visual primer</span>
  </div>
  <nav class="nav-links">
    <a href="index.html">Index</a>
    <a href="Geometry Primer.html" class="active">Geometry</a>
    <a href="Gradient Descent.html">Gradient descent</a>
  </nav>
</header>

<!-- Tweaks panel -->
<aside class="tweaks">
  <div class="title">
    <span>Tweaks</span>
  </div>

  <div class="toggle-row">
    <div class="lbl">Palette</div>
    <div id="palette-grid" class="palette-grid"></div>
  </div>

  <div class="toggle-row">
    <div class="lbl">Sphere</div>
    <div class="seg">
      <button data-tw-style="translucent" class="active">Translucent</button>
      <button data-tw-style="matte">Matte</button>
    </div>
  </div>

  <hr class="rule" />

  <div class="legend">
    <div class="item"><span class="swatch" style="background:var(--accent)"></span> base point p</div>
    <div class="item"><span class="swatch" style="background:var(--viz-q)"></span> target q</div>
    <div class="item"><span class="swatch line" style="background:var(--viz-tangent)"></span> tangent vector</div>
    <div class="item"><span class="swatch line" style="background:var(--viz-geodesic)"></span> geodesic</div>
    <div class="item"><span class="swatch line" style="background:var(--viz-transport)"></span> parallel transport</div>
    <div class="item"><span class="swatch" style="background:var(--viz-retract)"></span> retraction</div>
  </div>
</aside>

<!-- chapter side panel -->
<aside class="side">
  <div class="chap-eyebrow">
    <span id="chap-eyebrow" class="eyebrow">Manifold</span>
    <span><span id="chap-num" class="num">01</span><span class="total"> / <span id="chap-total">08</span></span></span>

  <hr class="rule" />
  <div id="chap-body" class="chap-body"></div>
  <div id="chap-formula" class="formula"></div>

    <span class="arrow">→</span>
  </button>
