<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Speaker Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:    #0e0d0b;
    --ink:   #f3eee0;
    --ink-2: #cabf9f;
    --ink-3: #8a8170;
    --rule:  rgba(243,238,224,0.12);
    --accent:#d23b1c;
    --green: #3d9970;
    --amber: #e09428;
    --red:   #d23b1c;
    --mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans:  -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }

  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    gap: 0;
    overflow: hidden;
  }

  /* ── Header bar ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(10px,2vh,20px) clamp(16px,2.5vw,32px);
    border-bottom: 1px solid var(--rule);
    gap: clamp(12px,2vw,28px);
    flex-shrink: 0;
    flex-wrap: wrap;
    row-gap: 6px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: clamp(12px,2vw,28px);
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }

  .slide-label {
    font-family: var(--mono);
    font-size: clamp(12px,1.6vw,16px);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slide-counter {
    font-family: var(--mono);
    font-size: clamp(14px,1.8vw,18px);
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .slide-counter .sep { color: var(--ink-3); margin: 0 3px; }
  .step-counter {
    font-family: var(--mono);
    font-size: clamp(12px,1.5vw,15px);
    color: var(--ink-3);
    white-space: nowrap;
    padding-left: clamp(10px,1.5vw,18px);
    border-left: 1px solid var(--rule);
    flex-shrink: 0;
  }
  .step-counter:empty { display: none; }

  /* ── Timer block ── */
  .timer-block {
    display: flex;
    align-items: center;
    gap: clamp(8px,1.2vw,16px);
    flex-shrink: 0;
    padding-left: clamp(12px,1.8vw,22px);
    border-left: 1px solid var(--rule);
  }
  .timer-display {
    font-family: var(--mono);
    font-size: clamp(20px,3vw,32px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    color: var(--ink);
    transition: color 0.4s;
    cursor: pointer;
    user-select: none;
  }
  .timer-display.amber { color: var(--amber); }
  .timer-display.red   { color: var(--red); animation: pulse 1s ease infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.65} }

  .timer-btn {
    font-family: var(--mono);
    font-size: clamp(11px,1.4vw,15px);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 4px;
    color: var(--ink-3);
    padding: 4px 10px 5px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .timer-btn:hover { color: var(--ink); border-color: rgba(243,238,224,0.3); }
  .timer-btn.active { color: var(--accent); border-color: var(--accent); }

  .countdown-input {
    font-family: var(--mono);
    font-size: clamp(12px,1.5vw,15px);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    color: var(--ink-3);
    width: clamp(48px,5.5vw,68px);
    text-align: center;
    outline: none;
    padding: 2px 3px;
    transition: border-color 0.15s, color 0.15s;
  }
  .countdown-input:focus { border-color: var(--ink-3); color: var(--ink); }
  .countdown-label {
    font-family: var(--mono);
    font-size: clamp(11px,1.3vw,14px);
    color: var(--ink-3);
    white-space: nowrap;
  }

  /* ── Notes area ── */
  main {
    padding: clamp(20px,4vh,48px) clamp(20px,4vw,48px) clamp(16px,3vh,32px);
    overflow-y: auto;
    min-height: 0;
  }
  .notes-text {
    font-size: clamp(18px,3.5vh,30px);
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .notes-empty {
    font-size: clamp(16px,2.8vh,24px);
    color: var(--ink-3);
    font-style: italic;
  }

  /* ── Next slide footer ── */
  footer {
    border-top: 1px solid var(--rule);
    padding: clamp(10px,1.8vh,18px) clamp(16px,2.5vw,32px);
    display: flex;
    align-items: baseline;
    gap: clamp(10px,1.8vw,20px);
    flex-shrink: 0;
    min-width: 0;
    overflow: hidden;
  }
  .next-tag {
    font-family: var(--mono);
    font-size: clamp(10px,1.3vw,14px);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .next-label {
    font-family: var(--mono);
    font-size: clamp(12px,1.6vw,16px);
    color: var(--ink-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
    max-width: 40%;
  }
  .next-note {
    font-size: clamp(12px,1.6vw,16px);
    color: var(--ink-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    font-style: italic;
    min-width: 0;
  }

  /* ── Transition flash ── */
  @keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.6} }
  body.flash { animation: flash 120ms ease; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="slide-label" id="slide-label">—</span>
    <span class="slide-counter">
      <span id="current">—</span>
      <span class="sep">/</span>
      <span id="total">—</span>
    </span>
    <span class="step-counter" id="step-counter"></span>
  </div>

  <div class="timer-block">
    <span class="timer-display" id="timer-display" title="Click to start/pause">00:00</span>
    <button class="timer-btn" id="timer-toggle" title="Space">▶</button>
    <button class="timer-btn" id="timer-reset" title="R">↺</button>
    <input class="countdown-input" id="countdown-input" type="text" value="" placeholder="—" title="Countdown mm:ss (e.g. 20:00)" />
    <span class="countdown-label">cd</span>
  </div>
</header>

<main>
  <div id="notes-body" class="notes-empty">Waiting for deck…</div>
</main>

<footer>
  <span class="next-tag">Next →</span>
  <span class="next-label" id="next-label">—</span>
  <span class="next-note" id="next-note"></span>
</footer>

<script>
  const $ = id => document.getElementById(id);

  // ── Slide sync ────────────────────────────────────────────────────────────
  function render(data) {
    if (!data) return;

    $('current').textContent     = data.index + 1;
    $('total').textContent       = data.total;
    $('slide-label').textContent = data.label || '—';

    $('step-counter').textContent = data.maxStep > 0
      ? `step ${data.step} / ${data.maxStep}` : '';

    const notesEl = $('notes-body');
    if (data.note) {
      notesEl.className   = 'notes-text';
      notesEl.textContent = data.note;
    } else {
      notesEl.className   = 'notes-empty';
      notesEl.textContent = 'No notes for this slide.';
    }

    $('next-label').textContent = data.nextLabel || '—';
    $('next-note').textContent  = data.nextNote  || '';
  }

  function flash() {
    document.body.classList.remove('flash');
    void document.body.offsetWidth;
    document.body.classList.add('flash');
  }

  try { const s = localStorage.getItem('deck-stage:live'); if (s) render(JSON.parse(s)); } catch {}

  window.addEventListener('storage', e => {
    if (e.key === 'deck-stage:live' && e.newValue) {
      try { render(JSON.parse(e.newValue)); flash(); } catch {}
    }
  });

  // ── Timer ─────────────────────────────────────────────────────────────────
  let elapsed   = 0;       // seconds counted up
  let running   = false;
  let rafId     = null;
  let lastTs    = null;
  let countdown = 0;       // 0 = stopwatch mode; >0 = target seconds for countdown

  const timerDisplay = $('timer-display');
  const timerToggle  = $('timer-toggle');
  const timerReset   = $('timer-reset');
  const cdInput      = $('countdown-input');

  function fmt(s) {
    const abs = Math.abs(Math.round(s));
    const sign = s < 0 ? '-' : '';
    return `${sign}${String(Math.floor(abs / 60)).padStart(2,'0')}:${String(abs % 60).padStart(2,'0')}`;
  }

  function getDisplaySeconds() {
    return countdown > 0 ? countdown - elapsed : elapsed;
  }

  function updateDisplay() {
    const secs = getDisplaySeconds();
    timerDisplay.textContent = fmt(secs);

    timerDisplay.classList.remove('amber', 'red');
    if (countdown > 0) {
      const remaining = countdown - elapsed;
      if (remaining < 0) {
        timerDisplay.classList.add('red');
      } else if (remaining < countdown * 0.2) {
        timerDisplay.classList.add('amber');
      }
    }
  }

  function tick(ts) {
    if (!running) return;
    if (lastTs !== null) elapsed += (ts - lastTs) / 1000;
    lastTs = ts;
    updateDisplay();
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    if (running) return;
    running = true;
    lastTs  = null;
    timerToggle.textContent = '⏸';
    timerToggle.classList.add('active');
    rafId = requestAnimationFrame(tick);
  }

  function pause() {
    if (!rafId) return;
    running = false;
    cancelAnimationFrame(rafId);
    rafId   = null;
    lastTs  = null;
    timerToggle.textContent = '▶';
    timerToggle.classList.remove('active');
    updateDisplay();
  }

  function toggleTimer() {
    running ? pause() : start();
  }

  function resetTimer() {
    pause();
    elapsed = 0;
    updateDisplay();
  }

  function parseCountdown(str) {
    if (!str || !str.trim()) return 0;
    const parts = str.trim().split(':');
    if (parts.length === 2) {
      const m = parseInt(parts[0], 10);
      const s = parseInt(parts[1], 10);
      if (!isNaN(m) && !isNaN(s)) return m * 60 + s;
    } else if (parts.length === 1) {
      const n = parseInt(parts[0], 10);
      if (!isNaN(n)) return n * 60;
    }
    return 0;
  }

  timerToggle.addEventListener('click', toggleTimer);
  timerDisplay.addEventListener('click', toggleTimer);

  timerReset.addEventListener('click', resetTimer);

  cdInput.addEventListener('change', () => {
    countdown = parseCountdown(cdInput.value);
    resetTimer();
  });

  cdInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { cdInput.blur(); }
  });

  // Keyboard: Space = toggle, R = reset (when not typing in input)
  document.addEventListener('keydown', e => {
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    if (e.key === ' ') {
      e.preventDefault();
      toggleTimer();
    } else if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      resetTimer();
    } else if (e.key === 'n' || e.key === 'N') {
      window.opener?.focus?.();
    }
  });

  updateDisplay();
</script>
</body>
</html>
