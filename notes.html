<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Speaker Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:    #0e0d0b;
    --ink:   #f3eee0;
    --ink-2: #cabf9f;
    --ink-3: #8a8170;
    --rule:  rgba(243,238,224,0.12);
    --accent:#d23b1c;
    --mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans:  -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }

  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 1fr;
    height: 100vh;
    gap: 0;
  }

  /* ── Header bar ── */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 24px 12px;
    border-bottom: 1px solid var(--rule);
    gap: 24px;
    flex-shrink: 0;
  }
  .slide-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .slide-counter {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .slide-counter .sep { color: var(--ink-3); margin: 0 3px; }
  .step-counter {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    white-space: nowrap;
    padding-left: 14px;
    border-left: 1px solid var(--rule);
    margin-left: 6px;
  }
  .step-counter:empty { display: none; }

  /* ── Notes area ── */
  main {
    padding: 28px 28px 20px;
    overflow-y: auto;
    min-height: 0;
  }
  .notes-text {
    font-size: 18px;
    line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .notes-empty {
    font-size: 15px;
    color: var(--ink-3);
    font-style: italic;
  }

  /* ── Next slide footer ── */
  footer {
    border-top: 1px solid var(--rule);
    padding: 12px 24px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-shrink: 0;
  }
  .next-tag {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .next-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .next-note {
    font-size: 12px;
    color: var(--ink-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    font-style: italic;
  }

  /* ── Transition flash ── */
  @keyframes flash { 0%,100%{opacity:1} 50%{opacity:0.6} }
  body.flash { animation: flash 120ms ease; }
</style>
</head>
<body>

<header>
  <span class="slide-label" id="slide-label">—</span>
  <span class="slide-counter">
    <span id="current">—</span>
    <span class="sep">/</span>
    <span id="total">—</span>
  </span>
  <span class="step-counter" id="step-counter"></span>
</header>

<main>
  <div id="notes-body" class="notes-empty">Waiting for deck…</div>
</main>

<footer>
  <span class="next-tag">Next →</span>
  <span class="next-label" id="next-label">—</span>
  <span class="next-note" id="next-note"></span>
</footer>

<script>
  const $ = id => document.getElementById(id);

  function render(data) {
    if (!data) return;

    $('current').textContent    = data.index + 1;
    $('total').textContent      = data.total;
    $('slide-label').textContent = data.label || '—';

    $('step-counter').textContent = data.maxStep > 0
      ? `step ${data.step} / ${data.maxStep}` : '';

    const notesEl = $('notes-body');
    if (data.note) {
      notesEl.className   = 'notes-text';
      notesEl.textContent = data.note;
    } else {
      notesEl.className   = 'notes-empty';
      notesEl.textContent = 'No notes for this slide.';
    }

    $('next-label').textContent = data.nextLabel || '—';
    $('next-note').textContent  = data.nextNote  || '';
  }

  function flash() {
    document.body.classList.remove('flash');
    void document.body.offsetWidth; // reflow
    document.body.classList.add('flash');
  }

  // Initial read
  try {
    const stored = localStorage.getItem('deck-stage:live');
    if (stored) render(JSON.parse(stored));
  } catch (e) {}

  // Live updates from other tabs/windows
  window.addEventListener('storage', e => {
    if (e.key === 'deck-stage:live' && e.newValue) {
      try { render(JSON.parse(e.newValue)); flash(); } catch (e) {}
    }
  });

  // N key re-focuses the most recently active deck window
  document.addEventListener('keydown', e => {
    if ((e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey) {
      window.opener?.focus?.();
    }
  });
</script>
</body>
</html>
