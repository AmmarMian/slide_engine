<style>
/* ============================================================
   Swiss Technical — single-theme template, with CSS-var hooks
   exposed so Tweaks can rewrite colors / fonts / density live.
   ============================================================ */
:root {
  /* palette: paper (default) */
  --bg: #f4f3ef;
  --bg-2: #ffffff;
  --ink: #0a0a0a;
  --ink-2: #2a2a2a;
  --ink-3: #6e6e6e;
  --ink-4: #a8a8a8;
  --rule: #0a0a0a;
  --rule-soft: rgba(10, 10, 10, 0.14);
  --accent: #d23b1c;
  --tint: #ebe9e0;

  /* font stacks (overridable) */
  --sans: 'Inter Tight', -apple-system, sans-serif;
  --serif: 'Newsreader', Georgia, serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;

  /* density (multiplier for paddings + line-heights) */
  --d-pad-x: 100px;
  --d-pad-y-top: 100px;
  --d-pad-y-bot: 80px;
  --d-gap: 1;
}

html, body { margin: 0; padding: 0; background: #1a1a1a; }
body { font-family: var(--sans); }

/* deck-stage scales the 1920x1080 canvas to fit; sections are absolute-laid-out by it */
deck-stage > section {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-feature-settings: "kern", "ss01", "cv11";
  padding: var(--d-pad-y-top) var(--d-pad-x) var(--d-pad-y-bot);
  display: flex; flex-direction: column;
  box-sizing: border-box;
  overflow: hidden;
}

/* Type scale — TYPE_SCALE = { title: 112/96/80, h1: 80, h2: 60, lede: 38, body: 30, small: 22 } */
.eyebrow {
  font-family: var(--mono);
  font-size: 24px; font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--accent);
  text-transform: uppercase;
}
.title {
  font-family: var(--sans);
  font-size: 112px; font-weight: 600;
  line-height: 0.95; letter-spacing: -0.045em;
  color: var(--ink);
  margin: 0; text-wrap: balance;
}
.h1 {
  font-family: var(--sans);
  font-size: 80px; font-weight: 600;
  line-height: 1.0; letter-spacing: -0.035em;
  color: var(--ink);
  margin: 0; text-wrap: balance;
}
.h2 {
  font-family: var(--sans);
  font-size: 60px; font-weight: 500;
  line-height: 1.05; letter-spacing: -0.025em;
  color: var(--ink);
  margin: 0; text-wrap: balance;
}
.lede {
  font-size: 38px; font-weight: 400;
  line-height: 1.35; letter-spacing: -0.015em;
  color: var(--ink-2);
  text-wrap: pretty;
}
.body { font-size: 30px; line-height: 1.4; color: var(--ink-2); text-wrap: pretty; }
.small { font-size: 24px; color: var(--ink-3); }
.label {
  font-family: var(--mono);
  font-size: 24px; font-weight: 500;
  letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink-3);
}
.mono { font-family: var(--mono); font-size: 26px; }

/* Page chrome */
.page-header {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 64px; padding-bottom: 14px;
  border-bottom: 2px solid var(--ink);
}
.page-footer {
  position: absolute; left: var(--d-pad-x); right: var(--d-pad-x); bottom: 36px;
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--mono); font-size: 24px;
  color: var(--ink-3); letter-spacing: 0.04em;
  padding-top: 14px; border-top: 1px solid var(--rule-soft);
}

/* Theorem block */
.theorem { padding: 28px 0; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
.theorem-tag {
  font-family: var(--mono);
  font-size: 24px; font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 18px;
  display: flex; gap: 18px; align-items: center;
}
.theorem-tag::before { content: ''; display: inline-block; width: 18px; height: 18px; background: var(--accent); }
.theorem-name { font-weight: 500; color: var(--ink); }
.theorem-body { font-family: var(--serif); font-size: 34px; line-height: 1.4; color: var(--ink); }

/* Display math */
.display-math { background: var(--bg-2); border: 1px solid var(--rule); padding: 64px 72px; position: relative; }
.eq-label {
  position: absolute; right: 32px; top: 50%; transform: translateY(-50%);
  font-family: var(--mono); font-size: 24px; color: var(--accent); letter-spacing: 0.04em;
}

/* Algorithm */
.algorithm { background: var(--bg-2); border: 1px solid var(--rule); }
.algorithm-header {
  padding: 16px 24px; border-bottom: 1px solid var(--rule);
  font-family: var(--mono); font-size: 24px; font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink);
  display: flex; justify-content: space-between; align-items: center;
}
.algorithm-header::before { content: '▸'; color: var(--accent); margin-right: 12px; }
.algorithm-body { padding: 28px 32px; font-family: var(--mono); font-size: 24px; line-height: 1.6; color: var(--ink); }

/* Tables */
table.results { width: 100%; border-collapse: collapse; font-family: var(--sans); font-feature-settings: "tnum"; }
table.results th {
  font-family: var(--mono); font-size: 24px; font-weight: 500;
  letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink-3); text-align: right;
  padding: 14px 18px; border-bottom: 2px solid var(--ink);
}
table.results th:first-child { text-align: left; }
table.results td {
  font-size: 28px; padding: 16px 18px; text-align: right;
  border-bottom: 1px solid var(--rule-soft);
  color: var(--ink); font-variant-numeric: tabular-nums;
}
table.results td:first-child { text-align: left; color: var(--ink-2); font-weight: 500; }
table.results tr.best td { color: var(--accent); font-weight: 600; }

.figcaption { font-family: var(--mono); font-size: 24px; color: var(--ink-3); letter-spacing: 0.02em; margin-top: 18px; display: flex; gap: 14px; }
.figcaption .num { font-weight: 600; color: var(--accent); }

.pullquote {
  font-family: var(--sans); font-size: 72px; font-weight: 500;
  line-height: 1.05; letter-spacing: -0.035em;
  color: var(--ink); text-wrap: balance;
}
.pullquote::before { content: ''; display: block; width: 100px; height: 6px; background: var(--accent); margin-bottom: 36px; }

.ref {
  display: grid; grid-template-columns: 70px 1fr;
  gap: 28px; padding: 18px 0;
  border-bottom: 1px solid var(--rule-soft);
  font-family: var(--sans); font-size: 24px; line-height: 1.4; color: var(--ink);
}
.ref-num { font-family: var(--mono); font-size: 24px; font-weight: 500; color: var(--accent); }
.ref-authors { font-weight: 500; color: var(--ink); }
.ref-venue { font-family: var(--mono); font-size: 24px; color: var(--ink-3); }

.katex { color: var(--ink); }

/* ───────── Inverted (dark) section dividers + end slide ───────── */
/* Always dark regardless of palette tweak — they're meant to break rhythm. */
section.section-divider {
  --inv-bg: #0e0d0b;
  --inv-ink: #f3eee0;
  --inv-ink-2: #cabf9f;
  --inv-ink-3: #8a8170;
  --inv-rule: rgba(243,238,224,0.18);
  --inv-noise: rgba(243,238,224,0.30);
  background: var(--inv-bg) !important;
  color: var(--inv-ink) !important;
  position: relative;
}
section.section-divider::before {
  /* subtle scanline texture for character */
  content: '';
  position: absolute; inset: 0; pointer-events: none;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0, transparent 3px,
    rgba(243,238,224,0.025) 3px, rgba(243,238,224,0.025) 4px
  );
  mix-blend-mode: screen;
}

/* ───────── Progress bar (fixed overlay, top of viewport) ───────── */
.progress-bar {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 2147483640;
  padding: 8px 22px 0;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(0,0,0,0.20), transparent);
}
.progress-track { display: flex; gap: 3px; align-items: stretch; }
.progress-seg { position: relative; height: 3px; min-width: 0; }
.progress-seg-bg { position: absolute; inset: 0; background: rgba(255,255,255,0.20); }
.progress-seg-fg { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); transition: width 360ms cubic-bezier(.2,.8,.2,1); }
.progress-seg-label {
  position: absolute; top: 7px; left: 0;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%;
}

@keyframes zoomIn {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<body>
<deck-stage width="1920" height="1080">
  <!-- Slides will be rendered into here by React, but we ALSO write them statically
       so deck-stage's slot enumeration sees 12 sections before React mounts.
       Actually: simpler — we mount React once into a wrapper and let it own all
       sections as direct children.  deck-stage observes children, so it works. -->
</deck-stage>

<div id="tweaks-root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "fontStyle": "swiss-sans",
  "palette": "paper",
  "accent": "#ff2600",
  "density": "airy",
  "mathEngine": "katex"
}/*EDITMODE-END*/;

// ─── presets ───
const FONT_PRESETS = {
  'swiss-sans':   { sans: "'Inter Tight', -apple-system, sans-serif",  serif: "'Newsreader', Georgia, serif",                              mono: "'JetBrains Mono', ui-monospace, monospace" },
  'modern-mixed': { sans: "'Inter', -apple-system, sans-serif",         serif: "'Source Serif 4', Georgia, serif",                          mono: "'JetBrains Mono', ui-monospace, monospace" },
  'editorial':    { sans: "'Inter', -apple-system, sans-serif",         serif: "'Source Serif 4', Georgia, serif",                          mono: "'IBM Plex Mono', ui-monospace, monospace" },
  'classic':      { sans: "'IBM Plex Sans', -apple-system, sans-serif", serif: "'EB Garamond', 'Source Serif 4', Georgia, serif",            mono: "'IBM Plex Mono', ui-monospace, monospace" },
};
const PALETTE_PRESETS = {
  paper:  { bg: '#f4f3ef', bg2: '#ffffff', ink: '#0a0a0a', ink2: '#2a2a2a', ink3: '#6e6e6e', rule: '#0a0a0a', ruleSoft: 'rgba(10,10,10,0.14)', tint: '#ebe9e0' },
  warm:   { bg: '#f7f1e6', bg2: '#fdf8eb', ink: '#1a1410', ink2: '#3a3328', ink3: '#7a6b54', rule: '#1a1410', ruleSoft: 'rgba(26,20,16,0.18)', tint: '#ede2c9' },
  cool:   { bg: '#f1f3f6', bg2: '#ffffff', ink: '#0c1422', ink2: '#2a3550', ink3: '#5a6680', rule: '#0c1422', ruleSoft: 'rgba(12,20,34,0.14)', tint: '#dbe0eb' },
  dark:   { bg: '#0e0d0b', bg2: '#1a1815', ink: '#f3eee0', ink2: '#cabf9f', ink3: '#8a8170', rule: '#f3eee0', ruleSoft: 'rgba(243,238,224,0.18)', tint: '#26211a' },
};
const DENSITY_PRESETS = {
  compact:      { padX: 80,  padTop: 72,  padBot: 60 },
  comfortable:  { padX: 100, padTop: 100, padBot: 80 },
  airy:         { padX: 140, padTop: 130, padBot: 110 },
};

// ─── math: KaTeX or MathJax ───
function ensureMathJax() {
  if (window.MathJax && window.MathJax.tex2svg) return Promise.resolve();
  return new Promise((res) => {
    window.MathJax = {
      tex: { inlineMath: [['$','$'],['\\(','\\)']] },
      svg: { fontCache: 'global' },
      startup: { typeset: false, ready: () => { window.MathJax.startup.defaultReady(); res(); } },
    };
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js';
    s.async = true;
    document.head.appendChild(s);
  });
}

const M = ({ tex, display, engine }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (engine === 'mathjax') {
      ensureMathJax().then(() => {
        if (!ref.current) return;
        const out = window.MathJax.tex2svg(tex, { display: !!display });
        ref.current.innerHTML = '';
        ref.current.appendChild(out);
        // strip default mathjax inline color
        ref.current.querySelectorAll('svg').forEach(s => { s.style.color = 'currentColor'; });
      });
    } else if (window.katex) {
      try { ref.current.innerHTML = window.katex.renderToString(tex, { throwOnError: false, displayMode: !!display, output: 'html' }); }
      catch { ref.current.textContent = tex; }
    } else {
      ref.current.textContent = tex;
    }
  }, [tex, display, engine]);
  return <span ref={ref} style={{ display: display ? 'block' : 'inline' }} />;
};

// ─── Slides ───
const TITLE = 'Discrete Diffusion for Tabular Data';
const SUBTITLE = 'A categorical framework for high-fidelity synthetic tables';
const AUTHORS = 'A. Researcher · B. Collaborator · C. Advisor';
const VENUE   = 'NeurIPS 2026 · Generative Models Workshop';

function PageHeader({ section, n, total = 18 }) {
  return (
    <div className="page-header">
      <div className="label">{section}</div>
      <div className="label">{String(n).padStart(2,'0')} / {String(total).padStart(2,'0')}</div>
    </div>
  );
}
function PageFooter() {
  return (
    <div className="page-footer">
      <div>Discrete Diffusion · Tabular</div>
      <div>{VENUE}</div>
    </div>
  );
}

function TitleSlide({ engine }) {
  return (
    <section data-label="01 Title" data-om-validate>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
          <div className="label">Paper presentation · 12 min</div>
          <div style={{ opacity: 0.95 }}>
            <MaskedReveal word="DISCRETE" cell={20} duration={1600} />
          </div>
        </div>
        <div>
          <div className="eyebrow" style={{ marginBottom: 32 }}>Discrete Diffusion · Tabular</div>
          <h1 className="title">{TITLE}</h1>
          <div className="lede" style={{ marginTop: 36, maxWidth: 1300 }}>{SUBTITLE}</div>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div className="body" style={{ fontSize: 28 }}>{AUTHORS}</div>
          <div className="small">{VENUE}</div>
        </div>
      </div>
    </section>
  );
}

function MotivationSlide() {
  return (
    <section data-label="04 Motivation" data-om-validate>
      <PageHeader section="01 · Motivation" n={4} />
      <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1.1fr 1fr', gap: 88, alignItems: 'start' }}>
        <div>
          <h2 className="h1">Tabular generation resists the tools that work elsewhere.</h2>
          <div className="lede" style={{ marginTop: 36 }}>
            Mixed continuous and categorical columns, heavy-tailed marginals, and brittle inter-column constraints break GAN- and VAE-based generators.
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 36 }}>
          {[
            ['Mixed types', 'Continuous, ordinal, and categorical columns coexist; common likelihoods do not.'],
            ['Multi-modal marginals', 'Real columns concentrate around discrete modes that smooth densities under-fit.'],
            ['Privacy & utility', 'Synthetic tables are deployed when raw data cannot be shared — fidelity matters.'],
          ].map(([t, d]) => (
            <div key={t} style={{ borderTop: '1px solid var(--rule-soft)', paddingTop: 22 }}>
              <div className="label" style={{ marginBottom: 12 }}>{t}</div>
              <div className="body" style={{ fontSize: 26 }}>{d}</div>
            </div>
          ))}
        </div>
      </div>
      <PageFooter />
    </section>
  );
}

function BackgroundSlide({ engine }) {
  return (
    <section data-label="06 Background" data-om-validate>
      <PageHeader section="02 · Background" n={6} />
      <h2 className="h1" style={{ marginBottom: 56 }}>Continuous diffusion in one diagram.</h2>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 40, justifyContent: 'center' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 18 }}>
          {[0,1,2,3,4,5].map((i) => {
            const noise = i / 5;
            return (
              <div key={i} style={{ aspectRatio: '1 / 1', position: 'relative', background: 'var(--bg-2)', border: '1px solid var(--rule-soft)' }}>
                <svg viewBox="0 0 100 100" preserveAspectRatio="none" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}>
                  {Array.from({length: 60}).map((_, k) => {
                    const seed = (k * 7 + i * 13) % 97;
                    const x = (seed * 31) % 100;
                    const y = (seed * 53) % 100;
                    const r = 1.4 + ((seed * 11) % 7) * 0.18;
                    const op = 1 - noise * 0.7;
                    return <circle key={k} cx={x} cy={y} r={r} fill="var(--ink)" opacity={op * 0.55} />;
                  })}
                  <ellipse cx={50} cy={50} rx={36 - i * 6} ry={26 - i * 4} fill="var(--accent)" opacity={Math.max(0, 0.45 - noise * 0.5)} />
                </svg>
                <div style={{ position: 'absolute', bottom: 8, left: 10, fontFamily: 'var(--mono)', fontSize: 24, color: 'var(--ink-3)' }}>
                  t = {Math.round(noise * 1000)}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0 8px' }}>
          <div className="mono" style={{ color: 'var(--ink)' }}>data&nbsp;&nbsp;<M tex="x_0" engine={engine} /></div>
          <div className="small" style={{ flex: 1, textAlign: 'center' }}>
            forward process &nbsp; <M tex="q(x_t \mid x_{t-1})" engine={engine} /> &nbsp; gradually destroys structure &nbsp; ⟶
          </div>
          <div className="mono" style={{ color: 'var(--ink)' }}><M tex="x_T \sim \mathcal{N}(0,I)" engine={engine} />&nbsp;&nbsp;noise</div>
        </div>
        <div className="body" style={{ maxWidth: 1500, marginTop: 12 }}>
          The continuous case assumes a <em>Gaussian</em> noising kernel — convenient analytically, but a poor fit when columns are <em>categorical</em> by nature.
        </div>
      </div>
      <PageFooter />
    </section>
  );
}

function DefinitionSlide({ engine }) {
  return (
    <section data-label="07 Definition" data-om-validate>
      <PageHeader section="03 · Definition" n={7} />
      <h2 className="h1" style={{ marginBottom: 64 }}>Discrete diffusion process.</h2>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 56 }}>
        <div className="theorem">
          <div className="theorem-tag">Definition 3.1 <span className="theorem-name">— Categorical forward kernel</span></div>
          <div className="theorem-body" style={{ fontSize: 32 }}>
            For a categorical variable <M tex="x_0 \in \{1,\dots,K\}" engine={engine} />, the forward process is the Markov chain
            <div style={{ margin: '24px 0', textAlign: 'center' }}>
              <M display tex="q(x_t \mid x_{t-1}) = \mathrm{Cat}\big(x_t;\ \boldsymbol{Q}_t\, \mathbf{e}_{x_{t-1}}\big)," engine={engine} />
            </div>
            with row-stochastic transition matrix <M tex="\boldsymbol{Q}_t \in [0,1]^{K\times K}" engine={engine} /> and absorbing state <M tex="[\mathsf{mask}]" engine={engine} />.
          </div>
        </div>
        <div className="body" style={{ fontSize: 28, maxWidth: 1500 }}>
          Marginals at any timestep close in form: <M tex="q(x_t \mid x_0) = \mathrm{Cat}(x_t;\ \overline{\boldsymbol{Q}}_t\, \mathbf{e}_{x_0})" engine={engine} />, where <M tex="\overline{\boldsymbol{Q}}_t = \boldsymbol{Q}_t \boldsymbol{Q}_{t-1} \cdots \boldsymbol{Q}_1" engine={engine} />. This makes training tractable: we sample <M tex="x_t" engine={engine} /> in one step from <M tex="x_0" engine={engine} />, no rollout needed.
        </div>
      </div>
      <PageFooter />
    </section>
  );
}

function EquationSlide({ engine }) {
  return (
    <section data-label="08 Objective" data-om-validate>
      <PageHeader section="04 · Objective" n={8} />
      <h2 className="h1" style={{ marginBottom: 32 }}>Variational bound, simplified.</h2>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 28, minHeight: 0, paddingBottom: 40 }}>
        <div className="display-math" style={{ fontSize: 28, padding: '36px 48px' }}>
          <M display tex="\mathcal{L}_{\text{vlb}} \;=\; \underbrace{\mathbb{E}_q\!\left[ -\log p_\theta(x_0 \mid x_1) \right]}_{\text{reconstruction}} \;+\; \sum_{t=2}^{T}\, \underbrace{\mathbb{E}_q\!\left[ D_{\mathrm{KL}}\!\big(q(x_{t-1} \mid x_t, x_0)\,\|\, p_\theta(x_{t-1} \mid x_t)\big) \right]}_{\text{denoising terms}}" engine={engine} />
          <div className="eq-label">(1)</div>
        </div>
        <div className="body" style={{ maxWidth: 1500, fontSize: 26, alignSelf: 'center', textAlign: 'center' }}>
          We follow the <em>simplified</em> objective of Austin et al. (2021)&nbsp;— a per-timestep cross-entropy on the predicted clean token, weighted by <M tex="\boldsymbol{w}_t" engine={engine} />.
        </div>
        <div className="display-math" style={{ fontSize: 28, padding: '32px 48px' }}>
          <M display tex="\mathcal{L}_{\text{simple}} \;=\; \mathbb{E}_{t,\,x_0,\,x_t}\!\left[\, \boldsymbol{w}_t \cdot \mathrm{CE}\!\big(\hat x_0(x_t, t),\; x_0\big) \,\right]" engine={engine} />
          <div className="eq-label">(2)</div>
        </div>
      </div>
      <PageFooter />
    </section>
  );
}

function AlgorithmSlide({ engine }) {
  return (
    <section data-label="09 Algorithm" data-om-validate>
      <PageHeader section="05 · Algorithm" n={9} />
      <h2 className="h1" style={{ marginBottom: 48 }}>Reverse process, sampling.</h2>
      <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: 64, alignItems: 'start' }}>
        <div className="algorithm">
          <div className="algorithm-header">
            <span>Algorithm 1 &nbsp;·&nbsp; Ancestral sampling</span>
            <span style={{ opacity: 0.6 }}>O(T·d)</span>
          </div>
          <div className="algorithm-body">
            <div><span style={{ color: 'var(--ink-3)' }}>1:</span> &nbsp;<b>input:</b> trained <M tex="\hat x_0" engine={engine} />, schedule <M tex="\{Q_t\}" engine={engine} />, length <M tex="d" engine={engine} /></div>
            <div><span style={{ color: 'var(--ink-3)' }}>2:</span> &nbsp;<M tex="x_T \leftarrow [\mathsf{mask}]^d" engine={engine} /></div>
            <div><span style={{ color: 'var(--ink-3)' }}>3:</span> &nbsp;<b>for</b>&nbsp; <M tex="t = T, T{-}1, \dots, 1" engine={engine} /> &nbsp;<b>do</b></div>
            <div><span style={{ color: 'var(--ink-3)' }}>4:</span> &nbsp;&nbsp;&nbsp;&nbsp; <M tex="\tilde x_0 \sim p_\theta(\,\cdot \mid x_t, t\,)" engine={engine} /></div>
            <div><span style={{ color: 'var(--ink-3)' }}>5:</span> &nbsp;&nbsp;&nbsp;&nbsp; <M tex="x_{t-1} \sim q(x_{t-1} \mid x_t,\, \tilde x_0)" engine={engine} /></div>
            <div><span style={{ color: 'var(--ink-3)' }}>6:</span> &nbsp;<b>end for</b></div>
            <div><span style={{ color: 'var(--ink-3)' }}>7:</span> &nbsp;<b>return</b>&nbsp; <M tex="x_0" engine={engine} /></div>
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 28 }}>
          <div>
            <div className="label" style={{ marginBottom: 10 }}>Why it works</div>
            <div className="body" style={{ fontSize: 26 }}>
              Conditioning on the predicted clean sample <M tex="\tilde x_0" engine={engine} /> reduces variance: the posterior <M tex="q(x_{t-1}\mid x_t, x_0)" engine={engine} /> is closed-form, so each step inherits the model's accuracy.
            </div>
          </div>
          <div>
            <div className="label" style={{ marginBottom: 10 }}>Compute</div>
            <div className="body" style={{ fontSize: 26 }}>
              For <M tex="T = 200" engine={engine} />, <M tex="d = 64" engine={engine} />, generation runs in 38 ms / row on a single A100.
            </div>
          </div>
        </div>
      </div>
      <PageFooter />
    </section>
  );
}

// ─── App: Tweaks + slide tree mounted into <deck-stage> ───
function applyTweaks(t) {
  const root = document.documentElement.style;
  const fp = FONT_PRESETS[t.fontStyle] || FONT_PRESETS['swiss-sans'];
  root.setProperty('--sans', fp.sans);
  root.setProperty('--serif', fp.serif);
  root.setProperty('--mono', fp.mono);

  const p = PALETTE_PRESETS[t.palette] || PALETTE_PRESETS.paper;
  root.setProperty('--bg', p.bg);
  root.setProperty('--bg-2', p.bg2);
  root.setProperty('--ink', p.ink);
  root.setProperty('--ink-2', p.ink2);
  root.setProperty('--ink-3', p.ink3);
  root.setProperty('--rule', p.rule);
  root.setProperty('--rule-soft', p.ruleSoft);
  root.setProperty('--tint', p.tint);

  root.setProperty('--accent', t.accent || '#d23b1c');

  const d = DENSITY_PRESETS[t.density] || DENSITY_PRESETS.comfortable;
  root.setProperty('--d-pad-x', d.padX + 'px');
  root.setProperty('--d-pad-y-top', d.padTop + 'px');
  root.setProperty('--d-pad-y-bot', d.padBot + 'px');
}

function Deck() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply CSS-var tweaks on every change.
  useEffect(() => { applyTweaks(t); }, [t]);

  const engine = t.mathEngine || 'katex';

  // Mount slides as direct children of <deck-stage> via portal.
  const stage = document.querySelector('deck-stage');

  // Section structure for the TOC + ProgressBar.
  const SECTIONS = [
    { label: 'Title',        start: 0,  end: 1,  blurb: 'Cover & contents.' },
    { label: 'Motivation',   start: 2,  end: 3,  blurb: 'Why tabular generation is hard.' },
    { label: 'Method',       start: 4,  end: 8,  blurb: 'Discrete diffusion, definitions, objective, sampling.' },
    { label: 'Architecture', start: 9,  end: 10, blurb: 'Token-level encoder, per-column heads.' },
    { label: 'Results',      start: 11, end: 14, blurb: 'Benchmarks, marginals, ablations, filmstrip.' },
    { label: 'Discussion',   start: 15, end: 17, blurb: 'Closing remark, references, end.' },
  ];

  const slides = (
    <>
      <TitleSlide               engine={engine} />
      <TocSlide                 sections={SECTIONS} />
      <SectionDivider           num={1} label="Motivation." kicker="Part 01 · Why now"  dataLabel="03 Section: Motivation"  slideNum={3}  totalSlides={18} />
      <MotivationSlide          engine={engine} />
      <SectionDivider           num={2} label="Method."      kicker="Part 02 · Formulation" dataLabel="05 Section: Method"  slideNum={5}  totalSlides={18} />
      <BackgroundSlide          engine={engine} />
      <DefinitionSlide          engine={engine} />
      <EquationSlide            engine={engine} />
      <AlgorithmSlide           engine={engine} />
      <SectionDivider           num={3} label="Architecture." kicker="Part 03 · The model" dataLabel="10 Section: Architecture" slideNum={10} totalSlides={18} />
      <InteractiveArchSlide />
      <SectionDivider           num={4} label="Results."      kicker="Part 04 · Evidence" dataLabel="12 Section: Results" slideNum={12} totalSlides={18} />
      <TableSlide               engine={engine} />
      <ChartSlide               engine={engine} />
      <FilmstripSlide />
      <DistSlide                engine={engine} />
      <QuoteSlide               engine={engine} />
      <ReferencesSlide          engine={engine} />
      <EndSlide />
    </>
  );

  return (
    <>
      {stage && ReactDOM.createPortal(slides, stage)}
      <ProgressBar sections={SECTIONS} />
      <TweaksPanel title="Tweaks">
        <TweakSection label="Typography" />
        <TweakSelect label="Font system" value={t.fontStyle}
          options={[
            { value: 'swiss-sans',   label: 'Swiss · Inter Tight + Newsreader' },
            { value: 'modern-mixed', label: 'Modern · Inter + Source Serif' },
            { value: 'editorial',    label: 'Editorial · Inter + Source Serif' },
            { value: 'classic',      label: 'Classic · IBM Plex + EB Garamond' },
          ]}
          onChange={(v) => setTweak('fontStyle', v)} />

        <TweakSection label="Palette" />
        <TweakRadio label="Background" value={t.palette}
          options={['paper', 'warm', 'cool', 'dark']}
          onChange={(v) => setTweak('palette', v)} />
        <TweakColor label="Accent" value={t.accent}
          onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density}
          options={['compact', 'comfortable', 'airy']}
          onChange={(v) => setTweak('density', v)} />

        <TweakSection label="Math" />
        <TweakRadio label="Engine" value={t.mathEngine}
          options={['katex', 'mathjax']}
          onChange={(v) => setTweak('mathEngine', v)} />
      </TweaksPanel>
    </>
  );
}

function boot() {
  if (!window.katex || !window.NLLChart || !window.useTweaks || !window.TweaksPanel || !window.TocSlide || !window.SectionDivider || !window.InteractiveArchSlide || !window.FilmstripSlide || !window.EndSlide || !window.ProgressBar) {
    return setTimeout(boot, 60);
  }
  // Render Tweaks + portal slides
  const tweaksRoot = document.getElementById('tweaks-root');
  ReactDOM.createRoot(tweaksRoot).render(<Deck />);
}
boot();
</script>
